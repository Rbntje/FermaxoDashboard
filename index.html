<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><title>Fermaxo Racing | Wheel Display</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="cockpit">
  <div class="wheel" aria-label="Fermaxo Racing virtual steering wheel">
    <div class="wheel-top"><div class="brand"><span class="brand-mark">F</span><span>FERMAXO <b>RACING</b><small>SIMULATION DIVISION</small></span></div><div class="rpm" id="rpmLeds" aria-label="Engine rev lights"></div><button class="round fullscreen" id="fullscreen" title="Toggle fullscreen">⛶</button></div>
    <div class="wheel-face">
      <aside class="controls left-controls">
        <div class="control-cluster"><button class="wheel-button red" id="pageDrive" data-page="drive"><span>DRIVE</span><small>PAGE 01</small></button><button class="wheel-button blue" id="pageErs" data-page="ers"><span>ENERGY</span><small>PAGE 02</small></button><button class="wheel-button yellow" id="pageTiming" data-page="timing"><span>TIMING</span><small>PAGE 03</small></button></div>
        <div class="rotary-wrap"><span>MODE</span><button class="rotary" id="pageNext" title="Next display page"><i></i></button><small id="pageLabel">01 / DRIVE</small></div>
        <div class="control-cluster lower"><button class="wheel-button cyan" id="demoButton"><span>DEMO</span><small>MANUAL</small></button><button class="wheel-button white" id="recordButton"><span>REC</span><small>SESSION</small></button><button class="wheel-button green" id="exportButton"><span>SAVE</span><small>JSON</small></button><input id="loadFile" type="file" accept=".json,application/json" hidden></div>
      </aside>
      <section class="lcd" aria-live="polite">
        <div class="lcd-head"><div><span class="eyebrow">FERMAXO RACING <i></i> TELEMETRY</span><h1 id="pageTitle">DRIVER DISPLAY</h1></div><div class="link-state"><i id="statusLed"></i><span id="statusText">WAITING FOR F1 TELEMETRY</span><button id="connectButton" title="Connect to local bridge">LINK</button></div></div>
        <div id="alert" class="alert hidden"><b id="alertTitle"></b><span id="alertText"></span></div>
        <div id="pageContent"></div>
        <div class="lcd-foot"><span id="sourceLabel">NO DATA SOURCE</span><span id="udpInfo">UDP 2026 · WAITING</span><span id="ageLabel">--</span></div>
      </section>
      <aside class="controls right-controls">
        <div class="control-cluster"><button class="wheel-button purple" id="pageEngineer" data-page="engineer"><span>ENGINEER</span><small>PAGE 04</small></button><button class="wheel-button orange" id="fullscreenButton"><span>VIEW</span><small>FULLSCREEN</small></button><button class="wheel-button teal" id="reconnectButton"><span>LINK</span><small>RECONNECT</small></button></div>
        <div class="dial-stack"><div class="dial"><span>DIFF</span><b id="diffDial">--</b></div><div class="dial"><span>BBAL</span><b>--</b></div><div class="dial"><span>MAP</span><b>--</b></div></div>
        <div class="control-cluster lower"><button class="wheel-button white" id="loadButton"><span>LOAD</span><small>SESSION</small></button><button class="wheel-button yellow" id="fullscreenKey"><span>HUD</span><small>TOGGLE</small></button><button class="wheel-button red" id="disconnectButton"><span>STOP</span><small>DEMO / LINK</small></button></div>
      </aside>
    </div>
    <div class="wheel-bottom"><div class="grip left-grip"></div><div class="bottom-controls"><span>F 1</span><div class="wheel-logo">FR</div><span>26</span></div><div class="grip right-grip"></div></div>
  </div>
  <div class="connection-drawer"><label for="bridgeUrl">BRIDGE</label><input id="bridgeUrl" value="ws://localhost:20778" spellcheck="false"><span id="packetInfo">0 PACKETS</span><span class="key-hint">F = FULLSCREEN · ← → = DISPLAY</span></div>
</main><script src="app.js"></script></body></html>
